version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: lab_postgres_dados
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: mtg_analyzer_data
    ports:
      - "5444:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
